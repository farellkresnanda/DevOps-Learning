name: Build and Deploy

on:
  push:
    branches:
      - master  # Trigger on master branch pushes
  pull_request:
    branches:
      - master  # Trigger on pull requests targeting master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.11.0'

    - name: Install dependencies
      run: |
        npm install

    - name: Build project
      run: |
        npm run build  # Placeholder for build, adjust if not necessary

  deploy:
    if: github.ref == 'refs/heads/master'  # Only deploy on master
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code again (to get latest changes)
      uses: actions/checkout@v4

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd ~/DevOps-Learning/node-deploy-test  # Adjust if needed
          git reset --hard HEAD
          git pull origin master
          npm install
          pm2 restart devops-test-app || pm2 start index.js --name devops-test-app
