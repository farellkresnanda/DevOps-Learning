name: Build and Deploy

on:
  push:
    branches:
      - master  # Trigger on master branch pushes
  pull_request:
    branches:
      - master  # Trigger on pull requests targeting master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.11.0'

    - name: Install dependencies
      run: |
        cd node-deploy-test
        npm install

    - name: Build project
      run: |
        cd node-deploy-test
        npm run build  # Optional: Adjust if you don't need to build the project

  deploy:
    if: github.ref == 'refs/heads/master'  # Only deploy on master
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code again (to get latest changes)
      uses: actions/checkout@v4

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Ensure we're in the correct directory
          cd /home/farel/DevOps-Learning/node-deploy-test  # Adjust to your server's path where package.json is located
          
          # Ensure no uncommitted changes
          git reset --hard HEAD
          git pull origin master  # Pull the latest code from the master branch
          
          # Install dependencies
          export PATH=$PATH:/home/farel/.nvm/versions/node/v20.19.1/bin  # Ensure the correct Node.js version is used
          npm install
          
          # Restart the app with PM2 or start it if it's not running
          pm2 restart devops-test-app || pm2 start index.js --name devops-test-app
